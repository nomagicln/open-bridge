name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    # Dependabot commits are generated by GitHub and cannot carry a
    # Signed-off-by trailer; skip DCO for bot PRs so dependency updates are
    # not permanently red.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify DCO sign-off
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
              range="${{ github.sha }}"
            else
              range="${{ github.event.before }}..${{ github.sha }}"
            fi
          fi

          missing=0
          for commit in $(git rev-list "$range"); do
            # Dependency bots (Dependabot, GitHub Actions) cannot add a
            # Signed-off-by trailer to their commits, so they are exempt from
            # DCO just like their pull requests are.
            author="$(git show -s --format='%an <%ae>' "$commit")"
            case "$author" in
              *dependabot*|*github-actions[bot]*)
                echo "Skipping bot commit $commit ($author)"
                continue
                ;;
            esac
            if ! git log -1 --pretty=%B "$commit" | grep -qi "^Signed-off-by: "; then
              echo "Missing Signed-off-by in commit $commit"
              missing=1
            fi
          done

          if [[ $missing -ne 0 ]]; then
            echo "DCO check failed. Please add Signed-off-by lines (git commit -s)."
            exit 1
          fi

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.27"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Download dependencies
        run: make deps

      - name: Run tests
        run: make test-coverage

      - name: Run integration tests
        if: matrix.os == 'ubuntu-latest'
        run: go test -tags=integration ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Run go vet (integration build tag)
        run: go vet -tags=integration ./...

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # Reachable vulnerabilities are zero as of the kin-openapi v0.149.0 /
      # go-sdk v1.4.1 upgrade, so this gate is blocking again.
      - name: Run govulncheck
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  docs:
    name: Docs Build
    runs-on: ubuntu-latest
    # Pre-flight the VitePress build only on pull requests that touch the docs
    # site or its dependency manifests.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-related changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --quiet "$base" HEAD -- docs package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.filter.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.filter.outputs.changed == 'true'
        run: npm ci

      - name: Build documentation
        if: steps.filter.outputs.changed == 'true'
        run: npm run docs:build

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [dco, test, lint, security]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build binary
        run: make build

      - name: Test binary
        run: ./bin/ob --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ob-linux-amd64
          path: bin/ob

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
